<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}challenge portal{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="nav">
    <!--<a class="brand" href="{{ url_for('gallery') }}">challenge portal</a>-->
    <div></div>
    <nav>
      <a href="{{ url_for('gallery') }}" {% if request.endpoint == 'gallery' %}class="active"{% endif %}>gallery</a>
      <a href="{{ url_for('challenge') }}" {% if request.endpoint == 'challenges' %}class="active"{% endif %}>challenges</a>
      {% if g.user %}
        <a href="{{ url_for('account') }}" {% if request.endpoint == 'account' %}class="active"{% endif %}>{{ g.user.name }}</a>
        <form method="post" action="{{ url_for('logout') }}"><button class="link">log out</button></form>
      {% else %}
        <a href="{{ url_for('login') }}" {% if request.endpoint == 'login' %}class="active"{% endif %}>log in</a>
      {% endif %}
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <div id="toasts" aria-live="polite">
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="toast toast-{{ category }}">{{ message }}</div>
    {% endfor %}
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
